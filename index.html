<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        

        <div class="info">
            <div class="player-info">
                <h1>Player</h1>
                <div class="thumbnail" id="player-choice"></div>
                <p class="player-score">0</p>
            </div>
            <div class="computer-info">
                <h1>Computer</h1>
                <div class="thumbnail" id="computer-choice"></div>
                <p class="computer-score">0</p>
            </div>
        </div>
        <h1 class="round">Round: 1</h1>
        <h1 class="round-winner"></h1>

        <button class="reset">Reset</button>

        <div class="button-container">
            <button class="buttons" id="rock">✊</button>
            <button class="buttons" id="paper">🧻</button>
            <button class="buttons" id="scissors">✂</button> 
        </div>

        <div class="result"></div>

        <div class="history">
            <ol class="history-list">
                
            </ol>
        </div>
    </div>
</body>
</html>
